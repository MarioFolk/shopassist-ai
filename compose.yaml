services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: shopassist-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles:
      - test
    command: ["python", "-m", "pytest", "-v"]
